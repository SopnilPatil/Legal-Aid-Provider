<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Reset Password — Legal Aid Provider</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <span>⚖️</span>
      <h1>Legal Aid Provider</h1>
      <p>Create your new password</p>
    </div>

    <!-- Reset form -->
    <div id="step-reset">
      <div class="field">
        <label>New password</label>
        <input type="password" id="new-password" placeholder="Min 6 characters"/>
      </div>
      <div class="field">
        <label>Confirm new password</label>
        <input type="password" id="confirm-password" placeholder="Repeat your password"/>
      </div>
      <button class="auth-btn" onclick="handleReset()">
        Reset Password
      </button>
    </div>

    <!-- Success message -->
    <div id="step-success" style="display:none; text-align:center;">
      <div style="font-size:48px; margin-bottom:16px;">✅</div>
      <h3 style="font-family:var(--font-head); color:var(--gold); margin-bottom:12px;">
        Password Reset!
      </h3>
      <p style="color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:24px;">
        Your password has been changed successfully.
      </p>
      <a href="login.html" class="btn btn-primary">Go to Login</a>
    </div>

    <!-- Invalid token message -->
    <div id="step-invalid" style="display:none; text-align:center;">
      <div style="font-size:48px; margin-bottom:16px;">❌</div>
      <h3 style="font-family:var(--font-head); color:#f87171; margin-bottom:12px;">
        Link Expired
      </h3>
      <p style="color:var(--muted); font-size:14px; line-height:1.7; margin-bottom:24px;">
        This reset link has expired or already been used.
      </p>
      <a href="forgot-password.html" class="btn btn-primary">Request New Link</a>
    </div>

    <div class="auth-error" id="reset-error"></div>

  </div>
</div>

<script>
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.dataset.theme = saved;

  // Get token from URL — e.g. reset-password.html?token=abc123
  const urlParams = new URLSearchParams(window.location.search);
  const token     = urlParams.get('token');

  // If no token in URL redirect to forgot password
  if (!token) window.location.href = 'forgot-password.html';

  async function handleReset() {
    const newPassword     = document.getElementById('new-password').value;
    const confirmPassword = document.getElementById('confirm-password').value;
    const errEl           = document.getElementById('reset-error');
    errEl.textContent     = '';

    // Validate
    if (!newPassword || newPassword.length < 6) {
      errEl.textContent = 'Password must be at least 6 characters';
      return;
    }

    if (newPassword !== confirmPassword) {
      errEl.textContent = 'Passwords do not match';
      return;
    }

    try {
      const API_BASE = window.API_BASE_URL || localStorage.getItem('api_base_url') || 'http://localhost:8000/api';
      const res = await fetch(`${API_BASE}/auth/reset-password`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({
          token:        token,
          new_password: newPassword
        })
      });

      const data = await res.json();

      if (res.ok) {
        // Show success
        document.getElementById('step-reset').style.display   = 'none';
        document.getElementById('step-success').style.display = 'block';
      } else {
        // Token expired or invalid
        document.getElementById('step-reset').style.display   = 'none';
        document.getElementById('step-invalid').style.display = 'block';
      }

    } catch(e) {
      errEl.textContent = 'Network error. Make sure backend is running.';
    }
  }
</script>
</body>
</html>
