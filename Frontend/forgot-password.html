<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Forgot Password — Legal Aid Provider</title>
  <link rel="stylesheet" href="style.css"/>
</head>
<body>
<div class="auth-wrap">
  <div class="auth-card">

    <div class="auth-logo">
      <span>⚖️</span>
      <h1>Legal Aid Provider</h1>
      <p>Enter your email to reset your password</p>
    </div>

    <!-- Step 1 — Enter email -->
    <div id="step-email">
      <div class="field">
        <label>Email address</label>
        <input type="email" id="reset-email" placeholder="you@example.com"/>
      </div>
      <button class="auth-btn" onclick="handleForgotPassword()">
        Send Reset Link
      </button>
    </div>

    <!-- Step 2 — Success message -->
    <div id="step-success" style="display:none; text-align:center;">
      <div style="font-size:48px; margin-bottom:16px;">📧</div>
      <h3 style="font-family:var(--font-head); color:var(--gold); margin-bottom:12px;">
        Check your email
      </h3>
      <p style="color:var(--muted); font-size:14px; line-height:1.7;">
        If this email is registered, we have sent a password reset link.
        It expires in <strong style="color:var(--gold);">15 minutes</strong>.
      </p>
    </div>

    <div class="auth-error" id="forgot-error"></div>

    <div style="text-align:center; margin-top:20px;">
      <a href="login.html"
         style="font-size:13px; color:var(--muted); text-decoration:none;"
         onmouseover="this.style.color='var(--gold)'"
         onmouseout="this.style.color='var(--muted)'">
        ← Back to login
      </a>
    </div>

  </div>
</div>

<script>
  const saved = localStorage.getItem('theme');
  if (saved) document.documentElement.dataset.theme = saved;

  async function handleForgotPassword() {
    const email  = document.getElementById('reset-email').value.trim();
    const errEl  = document.getElementById('forgot-error');
    errEl.textContent = '';

    if (!email) {
      errEl.textContent = 'Please enter your email address';
      return;
    }

    try {
      const API_BASE = window.API_BASE_URL || localStorage.getItem('api_base_url') || 'http://localhost:8000/api';
      const res = await fetch(`${API_BASE}/auth/forgot-password`, {
        method:  'POST',
        headers: { 'Content-Type': 'application/json' },
        body:    JSON.stringify({ email })
      });

      const data = await res.json();

      // Show success message regardless
      document.getElementById('step-email').style.display   = 'none';
      document.getElementById('step-success').style.display = 'block';

    } catch(e) {
      errEl.textContent = 'Network error. Make sure backend is running.';
    }
  }
</script>
</body>
</html>
